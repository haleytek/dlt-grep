[package]
name = "dlt-grep"
version = "0.1.0"
edition = "2024"
description = "A grep-like tool for DLT (Diagnostic Log and Trace) files"
license = "Apache-2.0"

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dlt-core = "0.20"
rayon = "1"
regex = "1"
walkdir = "2"

[lib]
name = "dlt_grep"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "grep"
harness = false
