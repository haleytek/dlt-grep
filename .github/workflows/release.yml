name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Rename binary
        run: cp target/x86_64-unknown-linux-musl/release/dg dg-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: dg-linux-x86_64
          path: dg-linux-x86_64

  release:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: dg-linux-x86_64/dg-linux-x86_64
